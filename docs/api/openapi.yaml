        '401':
          $ref: '#/components/responses/Error401'

  /admin/community/threads/{id}:
    delete:
      tags:
        - Community
      summary: Moderate and delete discussion thread
      description: Admin-only content moderation endpoint to remove inappropriate discussions.
      operationId: deleteThread
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/SimpleSuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  # ============================================================================
  # MODULE 23: AUDIT LOGS
  # ============================================================================
  /admin/audit-logs:
    get:
      tags:
        - Audit Logs
      summary: Query security audit logs
      description: Searchable, tamper-evident audit history of all privileged administrative events.
      operationId: queryAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Audit logs collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /admin/audit-logs/export:
    get:
      tags:
        - Audit Logs
      summary: Export audit logs for compliance
      description: Generates a signed, verifiable JSON or CSV report of audit logs for regulatory and accreditation requirements.
      operationId: exportAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - name: format
          in: query
          required: true
          description: Export format
          schema:
            type: string
            enum: [json, csv]
      responses:
        '200':
          description: Audit log download stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  # ============================================================================
  # MODULE 24: ADMINISTRATION & TELEMETRY
  # ============================================================================
  /admin/telemetry:
    get:
      tags:
        - Administration & Telemetry
      summary: Get live operational telemetry
      description: Returns real-time database connection health, ping latency (ms), concurrent test sessions, and storage usage.
      operationId: getAdminTelemetry
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Operational telemetry metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /admin/support-sessions:
    post:
      tags:
        - Administration & Telemetry
      summary: Initialize audited "View As" support session
      description: Creates an audited administrative impersonation session to troubleshoot student cohort or test delivery issues.
      operationId: createSupportSession
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportSessionRequest'
      responses:
        '201':
          description: Support session token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSessionResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

# ============================================================================
# REUSABLE COMPONENTS (OpenAPI 3.1.0 JSON Schema Compliant)
# ============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT access token containing authenticated user identity, role, and claims.

  parameters:
    PageParam:
      name: page
      in: query
      description: Page index (1-based)
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      description: Maximum items per page
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    SortByParam:
      name: sortBy
      in: query
      description: Target column name for sorting
      schema:
        type: string
        default: created_at
    SortOrderParam:
      name: sortOrder
      in: query
      description: Sort direction
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    SearchParam:
      name: search
      in: query
      description: Case-insensitive search query
      schema:
        type: string
    IdempotencyKeyHeader:
      name: X-Idempotency-Key
      in: header
      required: true
      description: Unique mutation idempotency token (UUIDv4) to prevent duplicate transactions
      schema:
        type: string
        format: uuid

  responses:
    SimpleSuccess:
      description: Operation completed successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleSuccessResponse'
    Error400:
      description: Bad request or input validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_FAILED
              message: The request payload failed schema validation.
              details:
                - field: durationSeconds
                  message: Duration must be an integer between 300 and 14400.
            metadata:
              requestId: 8a4b2c1d-7e9f-4a3b-8c2d-1e0f9a8b7c6d
              timestamp: "2026-11-05T12:00:00.000Z"
    Error401:
      description: Authentication token missing, expired, or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: AUTH_TOKEN_EXPIRED
              message: Supabase authentication token has expired.
            metadata:
              requestId: 8a4b2c1d-7e9f-4a3b-8c2d-1e0f9a8b7c6d
              timestamp: "2026-11-05T12:00:00.000Z"
    Error403:
      description: Insufficient privileges or cohort access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: COHORT_ACCESS_DENIED
              message: You do not have active enrollment access to this cohort material.
            metadata:
              requestId: 8a4b2c1d-7e9f-4a3b-8c2d-1e0f9a8b7c6d
              timestamp: "2026-11-05T12:00:00.000Z"
    Error404:
      description: Target resource entity not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RESOURCE_NOT_FOUND
              message: The specified resource entity does not exist.
            metadata:
              requestId: 8a4b2c1d-7e9f-4a3b-8c2d-1e0f9a8b7c6d
              timestamp: "2026-11-05T12:00:00.000Z"
    Error409:
      description: Resource conflict or active attempt already in progress
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: ACTIVE_ATTEMPT_EXISTS
              message: An active attempt is already in progress for this assessment.
            metadata:
              requestId: 8a4b2c1d-7e9f-4a3b-8c2d-1e0f9a8b7c6d
              timestamp: "2026-11-05T12:00:00.000Z"
    Error410:
      description: Assessment testing window or deadline expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: ATTEMPT_DEADLINE_EXPIRED
              message: The submission deadline has passed. Answers cannot be saved.
            metadata:
              requestId: 8a4b2c1d-7e9f-4a3b-8c2d-1e0f9a8b7c6d
              timestamp: "2026-11-05T12:00:00.000Z"
    Error422:
      description: Semantic question or blueprint unprocessable entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INVALID_QUESTION_FORMAT
              message: Single-select MCQ format requires exactly 4 options with exactly 1 correct key.
            metadata:
              requestId: 8a4b2c1d-7e9f-4a3b-8c2d-1e0f9a8b7c6d
              timestamp: "2026-11-05T12:00:00.000Z"
    Error429:
      description: Rate limit threshold exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Request quota breached. Please retry after the cooldown period.
            metadata:
              requestId: 8a4b2c1d-7e9f-4a3b-8c2d-1e0f9a8b7c6d
              timestamp: "2026-11-05T12:00:00.000Z"
    Error500:
      description: Internal server runtime error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_SERVER_ERROR
              message: An unexpected server error occurred. Traced with request ID.
            metadata:
              requestId: 8a4b2c1d-7e9f-4a3b-8c2d-1e0f9a8b7c6d
              timestamp: "2026-11-05T12:00:00.000Z"
    Error502:
      description: Upstream AI model provider failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: AI_PROVIDER_ERROR
              message: AI generation service failed after exhausting model fallbacks.
            metadata:
              requestId: 8a4b2c1d-7e9f-4a3b-8c2d-1e0f9a8b7c6d
              timestamp: "2026-11-05T12:00:00.000Z"
    Error503:
      description: Service unavailable or database connection saturated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # --------------------------------------------------------------------------
    # Base Response Envelopes
    # --------------------------------------------------------------------------
    SimpleSuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully.
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'

    ResponseMetadata:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
          format: uuid
          example: e4b2d5a1-7c98-4b11-9a2f-1e8b7c6d5e4f
        timestamp:
          type: string
          format: date-time
          example: "2026-11-05T12:00:00.000Z"

    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages, hasNext, hasPrev]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 142
        totalPages:
          type: integer
          example: 8
        hasNext:
          type: boolean
          example: true
        hasPrev:
          type: boolean
          example: false

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            message:
              type: string
              example: The request payload failed schema validation.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'

    # --------------------------------------------------------------------------
    # Module 01: Health
    # --------------------------------------------------------------------------
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [status, uptimeSeconds, database]
          properties:
            status:
              type: string
              example: HEALTHY
            version:
              type: string
              example: 1.0.0
            uptimeSeconds:
              type: integer
              example: 84210
            database:
              type: object
              required: [status, latencyMs]
              properties:
                status:
                  type: string
                  example: CONNECTED
                latencyMs:
                  type: integer
                  example: 12
            storage:
              type: object
              properties:
                status:
                  type: string
                  example: CONNECTED

    # --------------------------------------------------------------------------
    # Module 02: Auth
    # --------------------------------------------------------------------------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: student@neetpreplms.institute.com
        password:
          type: string
          format: password
          example: MedicalStudent2026!

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: v1.MRj8_k1l2m3n...

    AuthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [accessToken, refreshToken, expiresIn, tokenType, user]
          properties:
            accessToken:
              type: string
              example: eyJhbGciOiJSUzI1NiIs...
            refreshToken:
              type: string
              example: v1.MRj8_...
            expiresIn:
              type: integer
              example: 3600
            tokenType:
              type: string
              example: Bearer
            user:
              type: object
              required: [id, fullName, email, role]
              properties:
                id:
                  type: string
                  format: uuid
                  example: e4b2d5a1-7c98-4b11-9a2f-1e8b7c6d5e4f
                fullName:
                  type: string
                  example: Aarav Patel
                email:
                  type: string
                  format: email
                  example: student@neetpreplms.institute.com
                role:
                  type: string
                  enum: [STUDENT, FACULTY, ADMIN]
                  example: STUDENT
                cohortId:
                  type: ["string", "null"]
                  format: uuid
                  example: c8b4d2e1-5f6a-4b9a-8e2f-5d1b7a9c3e4f
                cohortName:
                  type: ["string", "null"]
                  example: Batch 1 (Dec)

    # --------------------------------------------------------------------------
    # Module 03: Users & Roles
    # --------------------------------------------------------------------------
    UserProfileResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [id, fullName, email, role, status]
          properties:
            id:
              type: string
              format: uuid
              example: e4b2d5a1-7c98-4b11-9a2f-1e8b7c6d5e4f
            fullName:
              type: string
              example: Aarav Patel
            email:
              type: string
              example: student@neetpreplms.institute.com
            phone:
              type: ["string", "null"]
              example: "+919876543210"
            role:
              type: string
              enum: [STUDENT, FACULTY, ADMIN]
              example: STUDENT
            avatarPath:
              type: ["string", "null"]
              example: avatars/student-1.png
            locale:
              type: string
              example: en
            status:
              type: string
              enum: [ACTIVE, SUSPENDED, INACTIVE]
              example: ACTIVE
            activeCohort:
              type: ["object", "null"]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                  example: Batch 1 (Dec)

    UpdateProfileRequest:
      type: object
      properties:
        phone:
          type: string
          example: "+919876543210"
        avatarPath:
          type: string
          example: avatars/aarav-custom.png
        locale:
          type: string
          enum: [en, hi]
          default: en

    InviteUserRequest:
      type: object
      required: [email, fullName, role]
      properties:
        email:
          type: string
          format: email
          example: dr.rao@neetpreplms.institute.com
        fullName:
          type: string
          example: Dr. Sunita Rao
        role:
          type: string
          enum: [STUDENT, FACULTY, ADMIN]
          example: FACULTY
        cohortId:
          type: string
          format: uuid
        designation:
          type: string
          example: Senior Faculty of Biology

    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INACTIVE]
        reason:
          type: string
          example: Under investigation for syllabus leakage

    AssignRoleRequest:
      type: object
      required: [role, action]
      properties:
        role:
          type: string
          enum: [STUDENT, FACULTY, ADMIN]
        action:
          type: string
          enum: [GRANT, REVOKE]
        reason:
          type: string
          example: Faculty department head promotion

    PaginatedUsersResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    # --------------------------------------------------------------------------
    # Module 04: Students
    # --------------------------------------------------------------------------
    StudentDashboardResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [cohort, activeAssessmentsCount, completedTopicsCount, unreadAnnouncementsCount]
          properties:
            cohort:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                  example: Batch 1 (Dec)
            activeAssessmentsCount:
              type: integer
              example: 4
            completedTopicsCount:
              type: integer
              example: 84
            unreadAnnouncementsCount:
              type: integer
              example: 2

    StudentProgressResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [overallPercentage, subjects]
          properties:
            overallPercentage:
              type: number
              example: 68.5
            subjects:
              type: array
              items:
                type: object
                required: [subjectId, subjectName, completionPercentage, completedTopics, totalTopics]
                properties:
                  subjectId:
                    type: string
                    format: uuid
                  subjectName:
                    type: string
                    example: Biology
                  completionPercentage:
                    type: number
                    example: 74.2
                  completedTopics:
                    type: integer
                    example: 52
                  totalTopics:
                    type: integer
                    example: 70

    SetTopicProgressRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [NOT_STARTED, IN_PROGRESS, COMPLETED]

    # --------------------------------------------------------------------------
    # Module 05: Faculty
    # --------------------------------------------------------------------------
    FacultyDashboardResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [assignedCohortsCount, authoredQuestionsCount, activeQuizzesCount]
          properties:
            assignedCohortsCount:
              type: integer
              example: 2
            authoredQuestionsCount:
              type: integer
              example: 124
            activeQuizzesCount:
              type: integer
              example: 8

    CohortProgressResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            required: [studentId, studentName, completionPercentage]
            properties:
              studentId:
                type: string
                format: uuid
              studentName:
                type: string
                example: Aarav Patel
              completionPercentage:
                type: number
                example: 68.5

    # --------------------------------------------------------------------------
    # Module 06: Exam Catalog & Blueprints
    # --------------------------------------------------------------------------
    ExamCatalogResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            required: [id, code, name, status]
            properties:
              id:
                type: string
                format: uuid
              code:
                type: string
                example: NEET_UG
              name:
                type: string
                example: National Eligibility cum Entrance Test (Undergraduate)
              authorityName:
                type: ["string", "null"]
                example: National Testing Agency
              status:
                type: string
                example: ACTIVE

    BlueprintsResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            required: [id, examYear, version, status]
            properties:
              id:
                type: string
                format: uuid
              examYear:
                type: integer
                example: 2026
              version:
                type: integer
                example: 1
              status:
                type: string
                example: ACTIVE

    CreateBlueprintRequest:
      type: object
      required: [examId, examYear, version, sections]
      properties:
        examId:
          type: string
          format: uuid
        examYear:
          type: integer
          example: 2026
        version:
          type: integer
          example: 1
        sourceUrl:
          type: string
          example: https://nta.ac.in/neet-ug-2026-information-bulletin
        sections:
          type: array
          items:
            type: object
            required: [name, displayOrder, questionCount, maxMarks]
            properties:
              name:
                type: string
                example: Physics
              displayOrder:
                type: integer
                example: 1
              questionCount:
                type: integer
                example: 45
              maxMarks:
                type: number
                example: 180

    CreateScoringProfileRequest:
      type: object
      required: [name, correctMarks, incorrectMarks, unansweredMarks]
      properties:
        name:
          type: string
          example: NEET-UG Standard Marking
        correctMarks:
          type: number
          example: 4.00
        incorrectMarks:
          type: number
          example: -1.00
        unansweredMarks:
          type: number
          example: 0.00
        invalidItemPolicy:
          type: object
          example:
            dropped_item_full_credit: true

    # --------------------------------------------------------------------------
    # Module 07: Curriculum
    # --------------------------------------------------------------------------
    CurriculumResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            required: [id, code, name, chapters]
            properties:
              id:
                type: string
                format: uuid
              code:
                type: string
                example: BIO
              name:
                type: string
                example: Biology
              chapters:
                type: array
                items:
                  type: object
                  required: [id, name, displayOrder, topics]
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                      example: Human Physiology
                    displayOrder:
                      type: integer
                      example: 1
                    topics:
                      type: array
                      items:
                        type: object
                        required: [id, name, displayOrder]
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                            example: Cardiovascular Dynamics
                          displayOrder:
                            type: integer
                            example: 1

    StudyHubResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [chapterId, chapterName, highYieldPearls, objectives]
          properties:
            chapterId:
              type: string
              format: uuid
            chapterName:
              type: string
              example: Human Physiology
            estimatedRevisionMinutes:
              type: integer
              example: 120
            highYieldPearls:
              type: array
              items:
                type: string
                example: S1 (LUB) valve sound originates from AV tricuspid/bicuspid closure.
            objectives:
              type: array
              items:
                type: string

    CreateChapterRequest:
      type: object
      required: [subjectId, name, displayOrder]
      properties:
        subjectId:
          type: string
          format: uuid
        name:
          type: string
          example: Cell Biology & Genetics
        displayOrder:
          type: integer
          example: 1

    CreateTopicRequest:
      type: object
      required: [chapterId, name, displayOrder]
      properties:
