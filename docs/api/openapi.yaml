openapi: 3.1.0
info:
  title: NEET Prep LMS REST API
  version: 1.0.0
  description: |
    # NEET Prep LMS — Authoritative REST API Specification
    
    Production-grade, high-security OpenAPI 3.1.0 specification for the NEET Prep Learning Management System.
    Engineered for single-institute NEET-UG medical coaching operations with strict role governance, multi-cohort boundary isolation, protected content delivery, server-authoritative scoring, and AI-assisted academic workflows.
    
    ### Architectural Guarantees:
    - **Server-Authoritative Scoring:** Raw marks (+4 / -1 / 0), question status evaluations, and attempt timeouts are computed on the server. Active examination question payloads strictly leak zero answer keys or distractor rationales.
    - **Cohort Isolation:** Access boundaries between `Batch 1 (Dec)` and `Batch 2 (May/June)` are enforced via database Row-Level Security (RLS) and explicit cohort join tables.
    - **JWT & Role Integrity:** Supabase JWT Bearer authentication verified against server-managed `role_assignments` (neutralizing user-metadata self-escalation risks).
    - **Digital Rights & Anti-Piracy:** Private object storage served via short-lived, 15-minute expiring signed URLs with dynamic user watermarking.
    - **AI Multi-Model Fallback:** Groq LLM integration with automatic cascading fallback (`openai/gpt-oss-120b` → `openai/gpt-oss-20b` → `qwen/qwen3.8-27b`) and mandatory faculty review prior to publishing.
  contact:
    name: NEET Prep LMS Architecture & Platform Engineering
    email: api-architect@neetpreplms.institute.com
  license:
    name: Proprietary - Coaching Institute Academic Operations

servers:
  - url: https://api.neetpreplms.institute.com/api/v1
    description: Production API Server
  - url: http://localhost:5000/api/v1
    description: Local Monolith Development Server

tags:
  - name: Health
    description: Operational health diagnostics, memory telemetry, and database ping latencies
  - name: Authentication
    description: Session lifecycle, Supabase JWT verification, and credential exchange
  - name: Users & Roles
    description: Identity management, profile updates, and server-controlled role assignments
  - name: Students
    description: Student home dashboard, 7-subject syllabus completion, and topic progress toggles
  - name: Faculty
    description: Faculty cohort management, staffing assignments, and student progress inspection
  - name: Exam Catalog & Blueprints
    description: Competitive exam definitions and versioned syllabus blueprints
  - name: Curriculum
    description: 3-tier academic hierarchy (Subjects, Chapters, Topics) and Chapter Study Hub
  - name: Batches & Cohorts
    description: Cohort management, capacity tracking, and academic year schedules
  - name: Enrollments
    description: Student cohort enrollment and transfer lifecycle management
  - name: Resources
    description: Protected learning materials (Notes, Books, DPPs, PYQs, Videos) with signed URLs
  - name: Question Bank
    description: Question items and immutable revision history with 4/5-option formats
  - name: Answer Keys
    description: Protected answer key inspection and official challenge adjudication (Staff only)
  - name: Assessments
    description: Assessment definitions and immutable published testing versions
  - name: Attempts & Scoring
    description: Server-timed attempt runner, autosave engine, and authoritative grading
  - name: Analytics
    description: Recharts-ready student performance curves, subject mastery, and diagnostic reports
  - name: AI Question Generator
    description: AI MCQ drafting with Groq LLM fallback and 1-click publishing
  - name: AI Academic Assistant
    description: Context-aware student chatbot assistant for admissions, fees, and test rules
  - name: Student Documents
    description: Document verification checklist and auditor approval workflows
  - name: Announcements
    description: Institutional bulletins with priority broadcasting and cohort gating
  - name: Academic Calendar
    description: Event scheduling, test dates, and academic deadlines
  - name: Community
    description: Moderated academic discussion forums and nested comment threads
  - name: Audit Logs
    description: Tamper-evident security and governance event logs with CSV/JSON exports
  - name: Administration & Telemetry
    description: Operational metrics, database ping latency, and "View As" support sessions

paths:
  # ============================================================================
  # MODULE 01: SYSTEM HEALTH
  # ============================================================================
  /health:
    get:
      tags:
        - Health
      summary: System health check and telemetry ping
      description: Returns service status, system uptime, and live PostgreSQL database connectivity ping latency.
      operationId: getHealthStatus
      responses:
        '200':
          description: System is operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/Error503'

  # ============================================================================
  # MODULE 02: AUTHENTICATION
  # ============================================================================
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user credentials
      description: Validates email and password credentials via Supabase GoTrue, returning JWT access and refresh tokens.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh active session token
      description: Exchanges a cryptographically valid refresh token for a renewed access token.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Access token renewed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Terminate session
      description: Invalidate active refresh tokens and terminate session context.
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SimpleSuccess'
        '401':
          $ref: '#/components/responses/Error401'

  # ============================================================================
  # MODULE 03: USERS & ROLES
  # ============================================================================
  /users/me:
    get:
      tags:
        - Users & Roles
      summary: Retrieve authenticated user profile
      description: Returns the user's personal profile, verified active role, and cohort enrollment details.
      operationId: getCurrentUserProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Error401'
    patch:
      tags:
        - Users & Roles
      summary: Update own profile attributes
      description: Updates non-privileged user attributes such as phone number, avatar URL, or interface locale.
      operationId: updateCurrentUserProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile attributes updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'

  /admin/users:
    get:
      tags:
        - Users & Roles
      summary: List all institutional users
      description: Paginated query of institutional users with role, status, and search filters.
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - name: filter[role]
          in: query
          description: Filter by user role
          schema:
            type: string
            enum: [STUDENT, FACULTY, ADMIN]
        - name: filter[status]
          in: query
          description: Filter by account status
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED, INACTIVE]
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Paginated collection of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsersResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /admin/users/invite:
    post:
      tags:
        - Users & Roles
      summary: Authorize and invite new student or staff user
      description: Creates an authorized user record to prevent unverified self-registration and privilege escalation.
      operationId: inviteUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '201':
          description: User invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleSuccessResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /admin/users/{id}/status:
    patch:
      tags:
        - Users & Roles
      summary: Update user account status
      description: Suspends, locks, or reactivates an institutional user account.
      operationId: updateUserStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Target user profile UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          $ref: '#/components/responses/SimpleSuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  /admin/users/{id}/roles:
    post:
      tags:
        - Users & Roles
      summary: Grant or revoke user roles
      description: Server-authoritative role assignment recorded in `public.role_assignments` and logged in audit trails.
      operationId: assignUserRole
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Target user profile UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '200':
          $ref: '#/components/responses/SimpleSuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  # ============================================================================
  # MODULE 04: STUDENTS
  # ============================================================================
  /students/me/dashboard:
    get:
      tags:
        - Students
      summary: Get student home dashboard
      description: Consolidated student dashboard with active cohort name, active test drills count, syllabus progress, and notices.
      operationId: getStudentDashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Student dashboard payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDashboardResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /students/me/progress:
    get:
      tags:
        - Students
      summary: Get syllabus study progress
      description: Retrieves syllabus topic completion counters and percentage across all 7 core academic disciplines.
      operationId: getStudentProgress
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Syllabus progress metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgressResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /students/me/progress/topics/{topicId}:
    post:
      tags:
        - Students
      summary: Toggle syllabus topic completion
      description: Marks a syllabus topic as completed or in progress. Synchronizes state with Faculty and Admin oversight dashboards.
      operationId: setTopicProgress
      security:
        - BearerAuth: []
      parameters:
        - name: topicId
          in: path
          required: true
          description: Target curriculum topic UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTopicProgressRequest'
      responses:
        '200':
          $ref: '#/components/responses/SimpleSuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  # ============================================================================
  # MODULE 05: FACULTY
  # ============================================================================
  /faculty/me/dashboard:
    get:
      tags:
        - Faculty
      summary: Get faculty dashboard summary
      description: Aggregated faculty metrics covering assigned batches, authored questions, published resources, and active quizzes.
      operationId: getFacultyDashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Faculty dashboard overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyDashboardResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /faculty/me/cohorts:
    get:
      tags:
        - Faculty
      summary: List faculty assigned cohorts
      description: Returns academic batches assigned to the authenticated faculty member via `faculty_assignments`.
      operationId: getFacultyCohorts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Assigned cohorts collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortsResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /faculty/cohorts/{cohortId}/progress:
    get:
      tags:
        - Faculty
      summary: Inspect cohort student study progress
      description: Returns topic completion percentages and struggle points for all students enrolled in the assigned cohort.
      operationId: inspectCohortProgress
      security:
        - BearerAuth: []
      parameters:
        - name: cohortId
          in: path
          required: true
          description: Target academic cohort UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cohort student progress metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortProgressResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  # ============================================================================
  # MODULE 06: EXAM CATALOG & BLUEPRINTS
  # ============================================================================
  /exams:
    get:
      tags:
        - Exam Catalog & Blueprints
      summary: List supported examination tracks
      description: Returns institutional competitive examination definitions (e.g. NEET-UG).
      operationId: listExams
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Supported examination tracks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamCatalogResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /exams/{examId}/blueprints:
    get:
      tags:
        - Exam Catalog & Blueprints
      summary: List syllabus blueprints for exam
      description: Returns versioned exam blueprints containing subject sections, durations, and question quotas.
      operationId: listBlueprints
      security:
        - BearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          description: Examination definition UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Exam blueprints collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintsResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /admin/blueprints:
    post:
      tags:
        - Exam Catalog & Blueprints
      summary: Author new exam blueprint version
      description: Administrative creation of an exam cycle specification with section breakdowns.
      operationId: createBlueprint
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBlueprintRequest'
      responses:
        '201':
          description: Blueprint version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleSuccessResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /admin/blueprints/{id}/scoring-profiles:
    post:
      tags:
        - Exam Catalog & Blueprints
      summary: Define scoring profile for blueprint
      description: Configures verified marking rules (+4 correct, -1 incorrect, 0 skipped, dropped item credit).
      operationId: createScoringProfile
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Blueprint UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScoringProfileRequest'
      responses:
        '201':
          description: Scoring profile attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleSuccessResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  # ============================================================================
  # MODULE 07: CURRICULUM
  # ============================================================================
  /curriculum:
    get:
      tags:
        - Curriculum
      summary: Retrieve 3-tier academic curriculum hierarchy
      description: Returns structured Subjects, Chapters, and Topics across all 7 core disciplines (Biology, Chemistry, Physics, Mathematics, Logical Reasoning, English, General Knowledge).
      operationId: getCurriculumHierarchy
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Curriculum hierarchy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /curriculum/chapters/{chapterId}/study-hub:
    get:
      tags:
        - Curriculum
      summary: Get chapter study hub guide
      description: Returns high-yield pearls, learning objectives, revision time estimates, and linked practice drills for a chapter.
      operationId: getChapterStudyHub
      security:
        - BearerAuth: []
      parameters:
        - name: chapterId
          in: path
          required: true
          description: Target chapter UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chapter study hub guide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyHubResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /admin/curriculum/chapters:
    post:
      tags:
        - Curriculum
      summary: Add chapter to subject
      description: Staff endpoint to attach a chapter to an academic discipline.
      operationId: createChapter
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChapterRequest'
      responses:
        '201':
          $ref: '#/components/responses/SimpleSuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /admin/curriculum/topics:
    post:
      tags:
        - Curriculum
      summary: Add topic under chapter
      description: Staff endpoint to create a granular syllabus topic.
      operationId: createTopic
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopicRequest'
      responses:
        '201':
          $ref: '#/components/responses/SimpleSuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  # ============================================================================
  # MODULE 08: BATCHES & COHORTS
  # ============================================================================
  /cohorts:
    get:
      tags:
        - Batches & Cohorts
      summary: List institutional cohorts
      description: Returns active batches (e.g., Batch 1 Dec, Batch 2 May/June) and enrollment statuses.
      operationId: listCohorts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cohorts collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortsResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /admin/cohorts:
    post:
      tags:
        - Batches & Cohorts
      summary: Create academic cohort batch
      description: Admin-only creation of an academic batch with calendar bounds and capacity limit.
      operationId: createCohort
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCohortRequest'
      responses:
        '201':
          $ref: '#/components/responses/SimpleSuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  # ============================================================================
  # MODULE 09: ENROLLMENTS
  # ============================================================================
  /admin/enrollments:
    get:
      tags:
        - Enrollments
      summary: List student cohort enrollments
      description: Query active and historical student cohort enrollments with status filtering.
      operationId: listEnrollments
      security:
        - BearerAuth: []
      parameters:
        - name: cohortId
          in: query
          description: Filter by cohort UUID
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by enrollment status
          schema:
            type: string
            enum: [PENDING, ACTIVE, COMPLETED, TRANSFERRED, WITHDRAWN]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Enrollments collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnrollmentsResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

    post:
      tags:
        - Enrollments
      summary: Enroll student into cohort
      description: Attaches a student to an active batch cohort.
      operationId: enrollStudent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollStudentRequest'
      responses:
        '201':
          $ref: '#/components/responses/SimpleSuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /admin/enrollments/{id}/transfer:
    post:
      tags:
        - Enrollments
      summary: Transfer student between cohorts
      description: Safely transitions a student to a new batch (e.g. Batch 1 to Batch 2), archiving the prior enrollment and logging an audit record.
      operationId: transferStudentCohort
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Enrollment UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferStudentRequest'
      responses:
        '200':
          $ref: '#/components/responses/SimpleSuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  # ============================================================================
  # MODULE 10: RESOURCES
  # ============================================================================
  /resources:
    get:
      tags:
        - Resources
      summary: Discover learning resources
      description: Returns published notes, books, DPPs, and videos. Students strictly receive cohort-accessible materials; staff view all.
      operationId: listResources
      security:
        - BearerAuth: []
      parameters:
        - name: subjectId
          in: query
          schema:
            type: string
            format: uuid
        - name: chapterId
          in: query
          schema:
            type: string
            format: uuid
        - name: resourceType
          in: query
          schema:
            type: string
            enum: [NOTE, PDF, BOOK_REFERENCE, DPP, PYQ, VIDEO, IMAGE, LINK]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Resources collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResourcesResponse'
        '401':
          $ref: '#/components/responses/Error401'

    post:
      tags:
        - Resources
      summary: Create learning resource metadata
      description: Faculty or Admin creation of a resource record with optional document reading text.
      operationId: createResource
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
